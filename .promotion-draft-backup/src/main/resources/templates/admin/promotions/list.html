<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promotions — DriveNow Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link hrenhf="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 my-4 flex-grow-1">
    <div class="row">
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/admin-sidebar :: sidebar(active='promotions')}"></div>
        </div>

        <div class="col-md-9 col-lg-10">
            <div th:if="${success}" class="alert alert-success border-0 rounded-lg shadow-sm" role="alert" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 rounded-lg shadow-sm" role="alert" th:text="${error}"></div>

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
                <div>
                    <h1 class="h3 font-weight-bold text-navy mb-1">Promotion Management</h1>
                    <p class="text-muted small mb-0">Manage discount codes, validity dates, and quantities.</p>
                </div>
                <div class="mt-3 mt-md-0">
                    <a th:href="@{/admin/promotions/new}" class="btn btn-navy font-weight-bold btn-sm px-3 py-2 rounded-lg shadow-sm">
                        + Add Promotion
                    </a>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-xl overflow-hidden bg-white">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle admin-table">
                        <thead class="bg-surface-2 text-navy small font-weight-bold">
                        <tr>
                            <th class="border-top-0 py-3">Code</th>
                            <th class="border-top-0 py-3">Discount</th>
                            <th class="border-top-0 py-3">Start date</th>
                            <th class="border-top-0 py-3">End date</th>
                            <th class="border-top-0 py-3 text-center">Quantity</th>
                            <th class="border-top-0 py-3 text-center">Status</th>
                            <th class="border-top-0 py-3 text-center">Actions</th>
                        </tr>
                        </thead>
                        <tbody class="small text-navy">
                        <tr th:if="${#lists.isEmpty(promotions)}">
                            <td colspan="7" class="text-center py-4 text-muted">No promotions found.</td>
                        </tr>
                        <tr th:each="promotion : ${promotions}"
                            th:with="promotionStatus=${promotion.quantity == 0 ? 'OUT OF STOCK' : (today.isBefore(promotion.startDate) ? 'UPCOMING' : (today.isAfter(promotion.endDate) ? 'EXPIRED' : 'ACTIVE'))}">
                            <td class="font-weight-bold" th:text="${promotion.code}">WELCOME10</td>
                            <td>
                                <span th:text="${promotion.discountType == 'percent' ? #numbers.formatDecimal(promotion.discountValue, 0, 'POINT', 2, 'POINT') + '%' : #numbers.formatDecimal(promotion.discountValue, 0, 'COMMA', 0, 'POINT') + ' VND'}">10%</span>
                                <small class="d-block text-muted text-capitalize" th:text="${promotion.discountType}">percent</small>
                            </td>
                            <td th:text="${promotion.startDate}">2026-01-01</td>
                            <td th:text="${promotion.endDate}">2026-12-31</td>
                            <td class="text-center" th:text="${promotion.quantity}">100</td>
                            <td class="text-center">
                                <span class="badge badge-light border"
                                      th:classappend="${promotionStatus == 'ACTIVE' ? 'text-success' : (promotionStatus == 'EXPIRED' or promotionStatus == 'OUT OF STOCK' ? 'text-danger' : 'text-muted')}"
                                      th:text="${promotionStatus}">ACTIVE</span>
                            </td>
                            <td class="text-center">
                                <div class="d-inline-flex align-items-center justify-content-center" style="gap: 6px;">
                                    <a th:href="@{/admin/promotions/{id}/edit(id=${promotion.id})}" class="admin-btn btn-soft-primary">Edit</a>
                                    <form method="post" th:action="@{/admin/promotions/{id}/delete(id=${promotion.id})}" class="m-0"
                                          onsubmit="return confirm('Delete this promotion? Promotions linked to a booking cannot be deleted.');">
                                        <button type="submit" class="admin-btn btn-soft-danger">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
