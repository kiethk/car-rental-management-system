<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${promotionForm.id != null ? 'Edit Promotion' : 'New Promotion'} + ' — DriveNow Admin'">Promotion Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 my-4 flex-grow-1">
    <div class="row">
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/admin-sidebar :: sidebar(active='promotions')}"></div>
        </div>

        <div class="col-md-9 col-lg-10">
            <div th:if="${error}" class="alert alert-danger border-0 rounded-lg shadow-sm" role="alert" th:text="${error}"></div>

            <div class="card border-0 shadow-sm rounded-xl p-4 p-md-5 bg-white max-w-4xl">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <h1 class="h4 font-weight-bold text-navy mb-1"
                            th:text="${promotionForm.id != null ? 'Edit Promotion #' + promotionForm.id : 'Add New Promotion'}">Add New Promotion</h1>
                        <p class="text-muted small mb-0">Configure the promotion code, discount, validity dates, and quantity.</p>
                    </div>
                    <a th:href="@{/admin/promotions}" class="btn btn-outline-secondary btn-sm rounded-lg">Back to Promotions</a>
                </div>

                <form method="post"
                      id="promotion-form"
                      th:action="@{${promotionForm.id != null ? '/admin/promotions/' + promotionForm.id : '/admin/promotions'}}"
                      th:object="${promotionForm}"
                      enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-6 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">Promotion code <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{code}" class="form-control rounded-lg text-uppercase"
                                   maxlength="50" pattern="[A-Za-z0-9_-]+" placeholder="e.g. WELCOME10" required>
                            <small class="text-muted">Letters, numbers, hyphens, and underscores.</small>
                            <small class="d-block text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small>
                        </div>

                        <div class="col-md-6 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">Discount type <span class="text-danger">*</span></label>
                            <select th:field="*{discountType}" class="form-control rounded-lg" required>
                                <option value="">-- Select discount type --</option>
                                <option value="percent">Percentage (%)</option>
                                <option value="fixed">Fixed amount (VND)</option>
                            </select>
                            <small class="d-block text-danger" th:if="${#fields.hasErrors('discountType')}" th:errors="*{discountType}"></small>
                        </div>

                        <div class="col-md-6 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">Discount value <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{discountValue}" class="form-control rounded-lg"
                                   min="0" step="0.01" placeholder="e.g. 10 or 100000" required>
                            <small class="text-muted">Percentage discounts cannot exceed 100%.</small>
                            <small class="d-block text-danger" th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></small>
                        </div>

                        <div class="col-md-6 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">Quantity <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{quantity}" class="form-control rounded-lg" min="0" required>
                            <small class="d-block text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></small>
                        </div>

                        <div class="col-md-6 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">Start date <span class="text-danger">*</span></label>
                            <input type="date" th:field="*{startDate}" class="form-control rounded-lg" required>
                            <small class="d-block text-danger" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></small>
                        </div>

                        <div class="col-md-6 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">End date <span class="text-danger">*</span></label>
                            <input type="date" th:field="*{endDate}" class="form-control rounded-lg" required>
                            <small class="d-block text-danger" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></small>
                        </div>

                        <div class="col-12 form-group mb-3">
                            <label for="imageFile" class="font-weight-bold small text-navy mb-1">Promotion image</label>
                            <input type="file" id="imageFile" name="imageFile" class="form-control rounded-lg"
                                   accept="image/jpeg,image/png,image/webp">
                            <small class="text-muted">Optional. JPG, PNG, or WebP; maximum 5 MB.</small>
                            <div th:if="${promotionForm.urlImagePromotion != null and !promotionForm.urlImagePromotion.isBlank()}" class="mt-2">
                                <span class="small text-muted d-block">Current image:</span>
                                <img th:src="${promotionForm.urlImagePromotion}" alt="Promotion image"
                                     class="rounded border mt-1" style="max-height: 120px; max-width: 100%;">
                            </div>
                        </div>
                    </div>
                </form>
                <div class="d-flex justify-content-end gap-2 mt-3 pt-3 border-top">
                    <a th:href="@{/admin/promotions}" class="btn btn-light px-4 rounded-lg">Cancel</a>
                    <button type="submit" form="promotion-form"
                            class="btn btn-navy font-weight-bold px-4 rounded-lg shadow-sm"
                            style="display: inline-flex; visibility: visible;">
                        Save Promotion
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
