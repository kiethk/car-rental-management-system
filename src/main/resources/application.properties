spring.application.name=car-rental-management-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/car_rental_management}
spring.datasource.username=${DB_USER:crms}
spring.datasource.password=${DB_PASSWORD:crms_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
spring.config.import=optional:classpath:application-local.properties
