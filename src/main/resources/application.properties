spring.application.name=car-rental-management-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/car_rental_management}
spring.datasource.username=${DB_USER:crms}
spring.datasource.password=${DB_PASSWORD:crms_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
spring.config.import=optional:classpath:application-local.properties


# VNPay Sandbox Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE:14XXSXMY}
vnpay.hash-secret=${VNPAY_HASH_SECRET:FKZEMHOMZVNLEOGRAXRMCVUOQHNJCOHP}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8081/payment/vnpay-return}
vnpay.version=2.1.0
vnpay.command=pay
