spring.application.name=car-rental-management-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/car_rental_management}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
spring.config.import=optional:classpath:application-local.properties

# Contract PDF: embedded TTF fonts so Vietnamese diacritics render (see src/main/resources/fonts/README.md)
crms.contract.font.regular=${CONTRACT_FONT_REGULAR:classpath:fonts/LiberationSerif-Regular.ttf}
crms.contract.font.bold=${CONTRACT_FONT_BOLD:classpath:fonts/LiberationSerif-Bold.ttf}

# Mail (Gmail SMTP). Optional: without username/password the app still runs and only logs
# "email is not configured" when a contract should be emailed. Put your Gmail address and
# 16-character App Password in application-local.properties, never in this file.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# Sender shown to customers; empty means "DriveNow <spring.mail.username>"
crms.mail.from=${MAIL_FROM:}

# VNPay Sandbox Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE:14XXSXMY}
vnpay.hash-secret=${VNPAY_HASH_SECRET:FKZEMHOMZVNLEOGRAXRMCVUOQHNJCOHP}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8081/payment/vnpay/return}
vnpay.version=2.1.0
vnpay.command=pay

# Public address of the site, used for links inside emails
crms.base-url=${CRMS_BASE_URL:http://localhost:8081}

# Depot: cars are handed over and taken back on a whole hour between these hours (inclusive).
# 0 and 23 mean the depot works 24 hours a day.
crms.opening-hours.open=0
crms.opening-hours.close=23
crms.station.name=Kho xe DriveNow - \u0110H FPT TP.HCM
crms.station.address=L\u00F4 E2a-7, \u0110\u01B0\u1EDDng D1, Khu C\u00F4ng ngh\u1EC7 cao, Long Th\u1EA1nh M\u1EF9, TP. Th\u1EE7 \u0110\u1EE9c, TP.HCM
crms.station.phone=1900 6868
crms.station.map-embed-url=https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.7204527239955!2d106.80730807480559!3d10.841127589311382!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752731176b07b1%3A0xb752b24b379bae5e!2sFPT%20University%20HCMC!5e1!3m2!1sen!2s!4v1794108631900!5m2!1sen!2s
