spring.application.name=car-rental-management-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/car_rental_management}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
spring.config.import=optional:classpath:application-local.properties

# Contract PDF: embedded TTF fonts so Vietnamese diacritics render (see src/main/resources/fonts/README.md)
crms.contract.font.regular=${CONTRACT_FONT_REGULAR:classpath:fonts/NotoSans-Regular.ttf}
crms.contract.font.bold=${CONTRACT_FONT_BOLD:classpath:fonts/NotoSans-Bold.ttf}

# Mail (Gmail SMTP). Optional: without username/password the app still runs and only logs
# "email is not configured" when a contract should be emailed. Put your Gmail address and
# 16-character App Password in application-local.properties, never in this file.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# Sender shown to customers; empty means "DriveNow <spring.mail.username>"
crms.mail.from=${MAIL_FROM:}

# VNPay Sandbox Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE:14XXSXMY}
vnpay.hash-secret=${VNPAY_HASH_SECRET:FKZEMHOMZVNLEOGRAXRMCVUOQHNJCOHP}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8081/payment/vnpay/return}
vnpay.version=2.1.0
vnpay.command=pay
