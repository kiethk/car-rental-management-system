<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ cá nhân — DriveNow</title>
    <th:block th:replace="~{fragments/assets :: common}">
    </th:block>
    <link rel="stylesheet" th:href="@{/css/screens/customer/profile/index/style.css}">
  </head>
  <body class="d-flex flex-column min-vh-100 bg-surface" data-screen="customer/profile/index">
<th:block th:replace="~{layouts/customer :: shell(~{::screenContent})}">
    <th:block th:fragment="screenContent">
    
    <main class="container py-5 flex-grow-1">
      <div class="mb-4">
        <h1 class="h3 fw-bold text-navy mb-1">Hồ sơ tài khoản của tôi</h1>
      </div>
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card card-drivenow border shadow-sm p-4 bg-white rounded-4">
            <div th:replace="~{fragments/account-form :: form('/profile')}">
            </div>
          </div>
        </div>
      </div>
    </main>
    
  
    </th:block>
</th:block>
</body>
</html>
