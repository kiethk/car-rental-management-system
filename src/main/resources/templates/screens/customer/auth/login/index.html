<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập — DriveNow</title>
    <th:block th:replace="~{fragments/assets :: common}">
    </th:block>
  </head>
  <body class="bg-surface d-flex flex-column" data-screen="customer/auth/login">
    <main class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
      <div class="w-100 mx-auto">
        <!-- Brand Link Back to Home -->
        <div class="text-center mb-4">
          <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
            <img th:src="@{/images/car-rental-logo.svg}" alt="DriveNow Logo" width="44" height="44" class="rounded-3">
            <span class="fw-bold text-navy h4 mb-0">DriveNow</span>
          </a>
        </div>
        <div class="card card-drivenow border shadow-sm p-4 p-md-5 bg-white rounded-4">
          <div class="card-body p-0">
            <div class="text-center mb-4">
              <h1 class="h3 fw-bold text-navy mb-1">Chào mừng trở lại</h1>
            </div>
            <div class="alert alert-danger customer-py-2 small rounded-3" th:if="${error}" th:text="${error}">
            </div>
            <form method="post" th:action="@{/login}" th:object="${loginForm}" novalidate class="mt-3">
              <div class="form-group mb-3">
                <label for="email" class="small fw-bold text-navy mb-1">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-control customer-py-2 rounded-3" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" maxlength="150" autofocus placeholder="name@example.com">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                </div>
              </div>
              <div class="form-group mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="password" class="small fw-bold text-navy mb-0">Mật khẩu</label>
                </div>
                <input id="password" type="password" th:field="*{password}" class="form-control customer-py-2 rounded-3" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" maxlength="255" placeholder="••••••••">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                </div>
              </div>
              <button class="btn btn-navy fw-bold w-100 w-100 customer-py-2 rounded-3 shadow-sm auth-submit-btn" type="submit">Đăng nhập</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top small text-muted"> Chưa có tài khoản? <a th:href="@{/register}" class="fw-bold text-navy text-decoration-none">Đăng ký ngay</a>
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <a th:href="@{/}" class="text-muted small text-decoration-none">← Về trang chủ</a>
        </div>
      </div>
    </main>
  </body>
</html>
