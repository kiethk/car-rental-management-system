<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý tài khoản — Quản trị DriveNow</title>
    <th:block th:replace="~{fragments/assets :: common}"></th:block>
    <link rel="stylesheet" th:href="@{/css/screens/admin/accounts/list/style.css}">
    <link rel="stylesheet" th:href="@{/css/shared/dark.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface" data-screen="admin/accounts/list">

<th:block th:replace="~{layouts/admin :: shell(~{::screenContent}, 'accounts')}">
    <th:block th:fragment="screenContent">
<div th:if="${success}" class="alert alert-success border-0 rounded-lg shadow-sm" role="alert" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 rounded-lg shadow-sm" role="alert" th:text="${error}"></div>

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 accounts-list-div-detail">
                <div>
                    <h1 class="h3 fw-bold text-navy mb-1">Quản lý tài khoản</h1>
                </div>
                <a th:href="@{/admin/accounts/employees/new}" class="btn btn-navy fw-bold rounded-lg">Tạo nhân viên</a>
            </div>

            <ul class="nav nav-pills mb-4 bg-white p-2 rounded-xl border">
                <li class="nav-item">
                    <a class="nav-link fw-bold"
                       th:classappend="${query.type == 'customer'} ? 'active bg-navy text-white' : 'text-navy'"
                       th:href="@{/admin/accounts(type='customer')}">Khách hàng</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold"
                       th:classappend="${query.type == 'employee'} ? 'active bg-navy text-white' : 'text-navy'"
                       th:href="@{/admin/accounts(type='employee')}">Nhân viên</a>
                </li>
            </ul>

            <form method="get" th:action="@{/admin/accounts}" class="d-flex mb-3 accounts-list-form-detail">
                <input type="hidden" name="type" th:value="${query.type}">
                <input type="search" name="keyword" th:value="${query.keyword}" class="form-control" maxlength="100"
                       placeholder="Tìm kiếm theo họ tên hoặc email..." aria-label="Tìm kiếm theo họ tên hoặc email">
                <button type="submit" class="btn btn-navy fw-bold rounded-lg">Tìm kiếm</button>
            </form>

            <div class="card border-0 shadow-sm rounded-xl overflow-hidden bg-white">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle admin-table">
                        <thead class="bg-surface-2 text-navy small fw-bold">
                            <tr>
                                <th class="border-top-0 py-3">Họ và tên</th>
                                <th class="border-top-0 py-3">Email</th>
                                <th class="border-top-0 py-3">Số điện thoại</th>
                                <th class="border-top-0 py-3" th:if="${query.type == 'employee'}">Vai trò</th>
                                <th class="border-top-0 py-3 text-center">Trạng thái</th>
                                <th class="border-top-0 py-3 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="account : ${accounts}">
                                <td class="fw-bold text-navy" th:text="${account.name}">Họ tên</td>
                                <td th:text="${account.email}">name@example.com</td>
                                <td th:text="${account.phone}">0900000000</td>
                                <td th:if="${query.type == 'employee'}" ><span th:replace="~{fragments/labels :: role(${account.role})}">Nhân viên</span></td>
                                <td class="text-center">
                                    <span th:if="${account.active}" class="admin-status-badge bg-success text-white">Hoạt động</span>
                                    <span th:unless="${account.active}" class="admin-status-badge bg-danger text-white">Đã khóa</span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${account.type == 'employee' and account.id == currentAccountId}" class="small text-muted">Tài khoản của bạn</span>
                                    <form th:unless="${account.type == 'employee' and account.id == currentAccountId}" method="post"
                                          th:action="@{/admin/accounts/{type}/{id}/status(type=${account.type}, id=${account.id})}">
                                        <input type="hidden" name="active" th:value="${!account.active}">
                                        <button type="submit" class="btn btn-sm fw-bold rounded-lg"
                                                th:classappend="${account.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:text="${account.active} ? 'Khóa' : 'Kích hoạt'"
                                                th:attr="data-confirm=${account.active} ? 'Khóa tài khoản này?' : null" data-confirm-detail="Người dùng sẽ bị đăng xuất." data-confirm-ok="Khóa" data-confirm-tone="danger">Khóa</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(accounts)}">
                                <td colspan="6" class="text-center text-muted py-4">Không tìm thấy tài khoản nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:replace="~{fragments/pagination :: pager(${nav})}"></div>
    </th:block>
</th:block>

</body>
</html>
