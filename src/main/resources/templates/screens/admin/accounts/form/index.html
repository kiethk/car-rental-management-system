<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo nhân viên — Quản trị DriveNow</title>
    <th:block th:replace="~{fragments/assets :: common}"></th:block>
    <link rel="stylesheet" th:href="@{/css/screens/admin/accounts/form/style.css}">
    <link rel="stylesheet" th:href="@{/css/shared/dark.css}">
    <script defer th:src="@{/js/screens/admin/accounts/form/script.js}"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-surface" data-screen="admin/accounts/form">

<th:block th:replace="~{layouts/admin :: shell(~{::screenContent}, 'accounts')}">
    <th:block th:fragment="screenContent">
<h1 class="h3 fw-bold text-navy mb-1">Tạo nhân viên mới</h1>

            <div th:if="${error}" class="alert alert-danger border-0 rounded-lg shadow-sm" role="alert" th:text="${error}"></div>

            <div class="card border-0 shadow-sm rounded-xl bg-white p-4">
                <form method="post" th:action="@{/admin/accounts/employees}" th:object="${employeeForm}" novalidate>
                    <div class="form-group mb-3">
                        <label for="name" class="small fw-bold text-navy mb-1">Họ và tên</label>
                        <input id="name" type="text" th:field="*{name}" class="form-control rounded-lg" maxlength="100"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="phone" class="small fw-bold text-navy mb-1">Số điện thoại</label>
                        <input id="phone" type="tel" th:field="*{phone}" class="form-control rounded-lg" maxlength="20"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="email" class="small fw-bold text-navy mb-1">Email</label>
                        <input id="email" type="email" th:field="*{email}" class="form-control rounded-lg" maxlength="150"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="form-group mb-3">
                        <label for="password" class="small fw-bold text-navy mb-1">Mật khẩu tạm thời</label>
                        <input id="password" type="password" name="password" class="form-control rounded-lg" maxlength="255" autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="form-group mb-4">
                        <label for="role" class="small fw-bold text-navy mb-1">Vai trò</label>
                        <select id="role" th:field="*{role}" class="form-control rounded-lg"
                                th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                            <option value="staff">Nhân viên</option>
                            <option value="admin">Quản trị viên</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                    </div>
                    <div class="d-flex accounts-form-div-detail">
                        <button type="submit" class="btn btn-navy fw-bold rounded-lg">Tạo nhân viên</button>
                        <a th:href="@{/admin/accounts(type='employee')}" class="btn btn-outline-secondary fw-bold rounded-lg">Hủy</a>
                    </div>
                </form>
            </div>
    </th:block>
</th:block>

</body>
</html>
