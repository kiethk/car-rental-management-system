<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cài đặt tài khoản — Quản trị DriveNow</title>
    <th:block th:replace="~{fragments/assets :: common}"></th:block>
    <link rel="stylesheet" th:href="@{/css/screens/admin/profile/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface" data-screen="admin/profile">

<th:block th:replace="~{layouts/admin :: shell(~{::screenContent}, 'profile')}">
    <th:block th:fragment="screenContent">
<div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card card-drivenow border shadow-sm p-4 bg-white rounded-xl">
                        <div class="mb-4 text-center">
                            <h1 class="h4 fw-bold text-navy mb-1">Cài đặt tài khoản</h1>
                        </div>

                        <div th:replace="~{fragments/account-form :: form('/admin/profile')}"></div>
                    </div>
                </div>
            </div>
    </th:block>
</th:block>

</body>
</html>
