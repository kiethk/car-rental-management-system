<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Driving License Reviews — DriveNow Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 my-4 flex-grow-1">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/admin-sidebar :: sidebar(active='licenses')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">
            <div class="card card-drivenow border shadow-sm p-4 bg-white rounded-xl">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h4 font-weight-bold text-navy mb-1">Customer Driving License Reviews</h1>
                        <p class="text-muted small mb-0">Verify and approve customer driving credentials prior to car handover</p>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(licenses)}" class="alert alert-info py-3 rounded-lg border-0 bg-blue-50 text-blue-900">
                    There are currently no customer driving licenses waiting for review.
                </div>

                <div th:unless="${#lists.isEmpty(licenses)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0 admin-table">
                        <thead class="bg-surface text-navy font-weight-bold text-uppercase" style="font-size: 12px; letter-spacing: 0.05em;">
                        <tr>
                            <th class="py-3 px-3">Customer</th>
                            <th class="py-3 px-3">Email</th>
                            <th class="py-3 px-3">License Number</th>
                            <th class="py-3 px-3">Class</th>
                            <th class="py-3 px-3">Submitted At</th>
                            <th class="py-3 px-3 text-center">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="license : ${licenses}" class="border-bottom">
                            <td class="py-3 px-3 font-weight-bold text-navy" th:text="${license.customer.name}"></td>
                            <td class="py-3 px-3 text-muted" th:text="${license.customer.email}"></td>
                            <td class="py-3 px-3 font-mono font-weight-bold" th:text="${license.licenseNumber}"></td>
                            <td class="py-3 px-3"><span class="badge badge-light border text-navy font-weight-bold px-2 py-1" th:text="${license.licenseClass}"></span></td>
                            <td class="py-3 px-3 text-muted small" th:text="${license.submittedAt}"></td>
                            <td class="py-3 px-3 text-center">
                                <a class="admin-btn btn-soft-primary"
                                   th:href="@{/admin/licenses/{id}(id=${license.id})}">Review License</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
