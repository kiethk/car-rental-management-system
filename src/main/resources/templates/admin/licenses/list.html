<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pending License Reviews</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
    <h1 class="h3 mb-4">Pending License Reviews</h1>

    <div th:if="${#lists.isEmpty(licenses)}" class="alert alert-info">
        There are no licenses waiting for review.
    </div>

    <div th:unless="${#lists.isEmpty(licenses)}" class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Customer</th>
                <th>Email</th>
                <th>License number</th>
                <th>Class</th>
                <th>Submitted</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="license : ${licenses}">
                <td th:text="${license.customer.name}"></td>
                <td th:text="${license.customer.email}"></td>
                <td th:text="${license.licenseNumber}"></td>
                <td th:text="${license.licenseClass}"></td>
                <td th:text="${license.submittedAt}"></td>
                <td>
                    <a class="btn btn-primary btn-sm"
                       th:href="@{/admin/licenses/{id}(id=${license.id})}">Review</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
