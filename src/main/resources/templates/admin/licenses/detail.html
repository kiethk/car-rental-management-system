<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Review Driving License — DriveNow Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 my-4 flex-grow-1">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/admin-sidebar :: sidebar(active='licenses')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">
            <div class="card card-drivenow border shadow-sm p-4 bg-white rounded-xl mb-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <a th:href="@{/admin/licenses}" class="btn btn-light btn-sm px-3 mb-2 font-weight-bold">← Back to License Reviews</a>
                        <h1 class="h4 font-weight-bold text-navy mb-0">Review Customer Driving License</h1>
                    </div>
                </div>

                <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

                <div class="row g-4">
                    <!-- Customer Details -->
                    <div class="col-lg-5">
                        <div class="p-3 bg-surface rounded-xl border mb-3">
                            <h2 class="h6 font-weight-bold text-navy text-uppercase mb-3" style="letter-spacing: 0.05em;">Customer & Document Info</h2>
                            <dl class="row mb-0 small">
                                <dt class="col-5 text-muted mb-2">Customer:</dt>
                                <dd class="col-7 font-weight-bold text-navy mb-2" th:text="${license.customer.name}"></dd>

                                <dt class="col-5 text-muted mb-2">Email:</dt>
                                <dd class="col-7 mb-2" th:text="${license.customer.email}"></dd>

                                <dt class="col-5 text-muted mb-2">Phone:</dt>
                                <dd class="col-7 mb-2" th:text="${license.customer.phone}"></dd>

                                <dt class="col-5 text-muted mb-2">License No.:</dt>
                                <dd class="col-7 font-mono font-weight-bold mb-2" th:text="${license.licenseNumber}"></dd>

                                <dt class="col-5 text-muted mb-2">Class:</dt>
                                <dd class="col-7 mb-2"><span class="badge badge-light border text-navy font-weight-bold" th:text="${license.licenseClass}"></span></dd>

                                <dt class="col-5 text-muted mb-2">Expiry Date:</dt>
                                <dd class="col-7 font-weight-bold text-navy mb-2" th:text="${license.licenseExpiry}"></dd>

                                <dt class="col-5 text-muted mb-0">Submitted At:</dt>
                                <dd class="col-7 text-muted mb-0" th:text="${license.submittedAt}"></dd>
                            </dl>
                        </div>

                        <!-- Review Decision Form -->
                        <div class="p-3 bg-surface rounded-xl border">
                            <h2 class="h6 font-weight-bold text-navy text-uppercase mb-3" style="letter-spacing: 0.05em;">Verification Decision</h2>
                            <form method="post" th:action="@{/admin/licenses/{id}/review(id=${license.id})}" th:object="${approvalForm}">
                                <div class="form-group mb-3">
                                    <label for="rejectionReason" class="small font-weight-bold text-navy mb-1">Rejection Reason (Required if rejected)</label>
                                    <textarea id="rejectionReason" th:field="*{rejectionReason}"
                                              class="form-control rounded-lg" rows="3" maxlength="500" placeholder="e.g. Image blurry, expired date, details mismatch..."></textarea>
                                    <small class="text-danger" th:if="${#fields.hasErrors('rejectionReason')}" th:errors="*{rejectionReason}"></small>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" name="decision" value="approved" class="btn btn-success font-weight-bold px-4 rounded-lg shadow-sm">
                                        Approve License
                                    </button>
                                    <button type="submit" name="decision" value="rejected" class="btn btn-outline-danger font-weight-bold px-4 rounded-lg">
                                        Reject
                                    </button>
                                </div>
                                <div class="text-danger small mt-2" th:if="${#fields.hasErrors('decision')}" th:errors="*{decision}"></div>
                            </form>
                        </div>
                    </div>

                    <!-- License Image View -->
                    <div class="col-lg-7">
                        <div class="p-3 bg-surface rounded-xl border text-center">
                            <label class="small text-muted font-weight-bold mb-2 d-block text-left">Uploaded Document Photo</label>
                            <img th:src="@{/licenses/{id}/image(id=${license.id})}"
                                 alt="Customer driving license" class="img-fluid border rounded-lg shadow-sm bg-white" style="max-height: 480px; object-fit: contain;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
