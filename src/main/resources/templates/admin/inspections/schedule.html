<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lên lịch đăng kiểm — Quản trị DriveNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 my-4 flex-grow-1">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/admin-sidebar :: sidebar(active='inspections')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">
            <!-- Flash Error -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 rounded-lg shadow-sm" role="alert">
                <span th:text="${error}"></span>
            </div>

            <div class="card border-0 shadow-sm rounded-xl p-4 p-md-5 bg-white max-w-4xl">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <h1 class="h4 font-weight-bold text-navy mb-1">Lên lịch đăng kiểm & bảo dưỡng xe</h1>
                        <p class="text-muted small mb-0">Đặt lịch hẹn đưa xe đến trạm đăng kiểm hoặc xưởng dịch vụ.</p>
                    </div>
                    <a th:href="@{/admin/inspections}" class="btn btn-outline-secondary btn-sm rounded-lg">
                        Quay lại danh sách
                    </a>
                </div>

                <form method="post" th:action="@{/admin/inspections}" th:object="${inspectionForm}">
                    <div class="row g-3">
                        <!-- Select vehicle -->
                        <div class="col-md-12 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">Chọn xe cần đăng kiểm / bảo dưỡng <span class="text-danger">*</span></label>
                            <select th:field="*{vehicleId}" class="form-control rounded-lg" required>
                                <option value="" disabled selected>-- Chọn một xe --</option>
                                <option th:each="v : ${vehicles}" th:value="${v.id}"
                                        th:text="'Xe #' + ${v.id} + ' — ' + ${v.vehicleType.displayName} + ' — Biển số: ' + (${v.licensePlate != null} ? ${v.licensePlate.plate} : 'Chưa có biển') + ' (Trạng thái: ' + (${v.status == 'available'} ? 'sẵn sàng' : (${v.status == 'rented'} ? 'đang thuê' : (${v.status == 'maintenance'} ? 'bảo dưỡng' : 'ngừng khai thác'))) + ')'"></option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"></small>
                        </div>

                        <!-- Date & Time appointment -->
                        <div class="col-md-12 form-group mb-3">
                            <label class="font-weight-bold small text-navy mb-1">Ngày giờ hẹn <span class="text-danger">*</span></label>
                            <input type="datetime-local" th:field="*{scheduledAt}" class="form-control rounded-lg" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('scheduledAt')}" th:errors="*{scheduledAt}"></small>
                            <small class="form-text text-muted">Thời gian dự kiến đưa xe đến trạm đăng kiểm. Cả ngày hẹn sẽ bị khóa, xe không nhận đơn thuê trong ngày đó.</small>
                        </div>

                        <!-- Notes / Checklist -->
                        <div class="col-12 form-group mb-4">
                            <label class="font-weight-bold small text-navy mb-1">Ghi chú chuẩn bị & danh sách kiểm tra</label>
                            <textarea th:field="*{notes}" rows="3" class="form-control rounded-lg"
                                      placeholder="VD: Kiểm tra má phanh, thay nhớt, kiểm tra khí thải định kỳ..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/admin/inspections}" class="btn btn-light px-4 rounded-lg">Hủy</a>
                        <button type="submit" class="btn btn-navy font-weight-bold px-4 rounded-lg shadow-sm">
                            Lưu lịch hẹn
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
