<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4 mb-4">Change Password</h1>

                    <div class="alert alert-success" th:if="${param.changed}">
                        Password changed successfully.
                    </div>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form method="post" th:action="@{/admin/password}" th:object="${passwordForm}">
                        <div class="form-group">
                            <label for="currentPassword">Current password</label>
                            <input id="currentPassword" type="password" th:field="*{currentPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                   maxlength="255" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}"
                                 th:errors="*{currentPassword}"></div>
                        </div>

                        <div class="form-group">
                            <label for="newPassword">New password</label>
                            <input id="newPassword" type="password" th:field="*{newPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                   maxlength="255" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                 th:errors="*{newPassword}"></div>
                        </div>

                        <button class="btn btn-primary" type="submit">Change Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
