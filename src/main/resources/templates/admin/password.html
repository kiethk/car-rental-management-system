<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password — DriveNow Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 my-4 flex-grow-1">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/admin-sidebar :: sidebar(active='')}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card card-drivenow border shadow-sm p-4 bg-white rounded-xl">
                        <div class="mb-4 text-center">
                            <h1 class="h4 font-weight-bold text-navy mb-1">Change Account Password</h1>
                            <p class="text-muted small mb-0">Update your employee security credentials</p>
                        </div>

                        <div class="alert alert-success py-2 small" th:if="${param.changed}">
                            Your password has been changed successfully.
                        </div>
                        <div class="alert alert-danger py-2 small" th:if="${error}" th:text="${error}"></div>

                        <form method="post" th:action="@{/admin/password}" th:object="${passwordForm}">
                            <div class="form-group mb-3">
                                <label for="currentPassword" class="small font-weight-bold text-navy mb-1">Current Password</label>
                                <input id="currentPassword" type="password" th:field="*{currentPassword}"
                                       class="form-control rounded-lg"
                                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                       maxlength="255" placeholder="••••••••" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}"
                                     th:errors="*{currentPassword}"></div>
                            </div>

                            <div class="form-group mb-4">
                                <label for="newPassword" class="small font-weight-bold text-navy mb-1">New Password</label>
                                <input id="newPassword" type="password" th:field="*{newPassword}"
                                       class="form-control rounded-lg"
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                       maxlength="255" placeholder="••••••••" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                     th:errors="*{newPassword}"></div>
                            </div>

                            <button class="btn btn-navy font-weight-bold btn-block w-100 py-2 rounded-lg shadow-sm" type="submit">Update Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
