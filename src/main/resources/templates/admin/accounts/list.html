<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Management — DriveNow Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid px-lg-5 my-4 flex-grow-1">
    <div class="row">
        <div class="col-md-3 col-lg-2">
            <div th:replace="~{fragments/admin-sidebar :: sidebar(active='accounts')}"></div>
        </div>

        <div class="col-md-9 col-lg-10">
            <div th:if="${success}" class="alert alert-success border-0 rounded-lg shadow-sm" role="alert" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 rounded-lg shadow-sm" role="alert" th:text="${error}"></div>

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4" style="gap: 8px;">
                <div>
                    <h1 class="h3 font-weight-bold text-navy mb-1">Account Management</h1>
                    <p class="text-muted small mb-0">View customer and employee accounts, lock or activate them, and create employees.</p>
                </div>
                <a th:href="@{/admin/accounts/employees/new}" class="btn btn-navy font-weight-bold rounded-lg">Create Employee</a>
            </div>

            <ul class="nav nav-pills mb-4 bg-white p-2 rounded-xl border">
                <li class="nav-item">
                    <a class="nav-link font-weight-bold"
                       th:classappend="${query.type == 'customer'} ? 'active bg-navy text-white' : 'text-navy'"
                       th:href="@{/admin/accounts(type='customer')}">Customers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link font-weight-bold"
                       th:classappend="${query.type == 'employee'} ? 'active bg-navy text-white' : 'text-navy'"
                       th:href="@{/admin/accounts(type='employee')}">Employees</a>
                </li>
            </ul>

            <form method="get" th:action="@{/admin/accounts}" class="d-flex mb-3" style="gap: 8px;">
                <input type="hidden" name="type" th:value="${query.type}">
                <input type="search" name="keyword" th:value="${query.keyword}" class="form-control" maxlength="100"
                       placeholder="Search by name or email" aria-label="Search by name or email">
                <button type="submit" class="btn btn-navy font-weight-bold rounded-lg">Search</button>
            </form>

            <div class="card border-0 shadow-sm rounded-xl overflow-hidden bg-white">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle admin-table">
                        <thead class="bg-surface-2 text-navy small font-weight-bold">
                            <tr>
                                <th class="border-top-0 py-3">Name</th>
                                <th class="border-top-0 py-3">Email</th>
                                <th class="border-top-0 py-3">Phone</th>
                                <th class="border-top-0 py-3" th:if="${query.type == 'employee'}">Role</th>
                                <th class="border-top-0 py-3 text-center">Status</th>
                                <th class="border-top-0 py-3 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="account : ${accounts}">
                                <td class="font-weight-bold text-navy" th:text="${account.name}">Name</td>
                                <td th:text="${account.email}">name@example.com</td>
                                <td th:text="${account.phone}">0900000000</td>
                                <td th:if="${query.type == 'employee'}" class="text-capitalize" th:text="${account.role}">staff</td>
                                <td class="text-center">
                                    <span th:if="${account.active}" class="admin-status-badge badge-success">Active</span>
                                    <span th:unless="${account.active}" class="admin-status-badge badge-danger">Locked</span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${account.type == 'employee' and account.id == currentAccountId}" class="small text-muted">Your account</span>
                                    <form th:unless="${account.type == 'employee' and account.id == currentAccountId}" method="post"
                                          th:action="@{/admin/accounts/{type}/{id}/status(type=${account.type}, id=${account.id})}">
                                        <input type="hidden" name="active" th:value="${!account.active}">
                                        <button type="submit" class="btn btn-sm font-weight-bold rounded-lg"
                                                th:classappend="${account.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:text="${account.active} ? 'Lock' : 'Activate'"
                                                th:onclick="${account.active} ? 'return confirm(\'Lock this account? The user will be signed out.\');' : null">Lock</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(accounts)}">
                                <td colspan="6" class="text-center text-muted py-4">No accounts found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:replace="~{fragments/pagination :: pager(${nav})}"></div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
