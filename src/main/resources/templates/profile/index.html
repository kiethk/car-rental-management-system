<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile — DriveNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="mb-4">
        <h1 class="h3 font-weight-bold text-navy mb-1">My Account Profile</h1>
        <p class="text-muted small mb-0">Manage your contact information and security settings</p>
    </div>

    <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success py-2" th:if="${param.updated}">Profile updated successfully.</div>
    <div class="alert alert-success py-2" th:if="${param.passwordChanged}">Password changed successfully.</div>

    <div class="row g-4">
        <!-- Account Info -->
        <div class="col-md-6">
            <div class="card card-drivenow border shadow-sm p-4 bg-white rounded-xl h-100">
                <div class="card-body p-0">
                    <h2 class="h5 font-weight-bold text-navy mb-3">Account Information</h2>
                    <form method="post" th:action="@{/profile}" th:object="${profileForm}">
                        <div class="form-group mb-3">
                            <label for="name" class="small font-weight-bold text-navy mb-1">Full Name</label>
                            <input id="name" type="text" th:field="*{name}" class="form-control rounded-lg bg-light" readonly>
                            <small class="text-muted" style="font-size: 11px;">Name is linked to your verified identity</small>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email" class="small font-weight-bold text-navy mb-1">Email Address</label>
                            <input id="email" type="email" th:field="*{email}" class="form-control rounded-lg bg-light" readonly>
                        </div>

                        <div class="form-group mb-4">
                            <label for="phone" class="small font-weight-bold text-navy mb-1">Phone Number <span class="text-danger">*</span></label>
                            <input id="phone" type="tel" th:field="*{phone}" class="form-control rounded-lg"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   pattern="(0[0-9]{9}|\+84[0-9]{9})" maxlength="13" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <button class="btn btn-navy font-weight-bold px-4 rounded-lg shadow-sm" type="submit">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Change Password -->
        <div class="col-md-6">
            <div class="card card-drivenow border shadow-sm p-4 bg-white rounded-xl h-100">
                <div class="card-body p-0">
                    <h2 class="h5 font-weight-bold text-navy mb-3">Change Password</h2>
                    <div class="alert alert-danger py-2 small" th:if="${passwordError}" th:text="${passwordError}"></div>

                    <form method="post" th:action="@{/profile/password}" th:object="${passwordForm}">
                        <div class="form-group mb-3">
                            <label for="currentPassword" class="small font-weight-bold text-navy mb-1">Current Password <span class="text-danger">*</span></label>
                            <input id="currentPassword" type="password" th:field="*{currentPassword}"
                                   class="form-control rounded-lg"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                   maxlength="255" placeholder="••••••••" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}"
                                 th:errors="*{currentPassword}"></div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="newPassword" class="small font-weight-bold text-navy mb-1">New Password <span class="text-danger">*</span></label>
                            <input id="newPassword" type="password" th:field="*{newPassword}"
                                   class="form-control rounded-lg"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                   maxlength="255" placeholder="••••••••" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                 th:errors="*{newPassword}"></div>
                        </div>

                        <button class="btn btn-navy font-weight-bold px-4 rounded-lg shadow-sm" type="submit">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
