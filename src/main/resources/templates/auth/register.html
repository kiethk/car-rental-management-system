<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4 mb-4 text-center">Customer Registration</h1>

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form method="post" th:action="@{/register}" th:object="${registerForm}">
                        <div class="form-group">
                            <label for="name">Full name</label>
                            <input id="name" type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   maxlength="100" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"></div>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone number</label>
                            <input id="phone" type="tel" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   pattern="(0[0-9]{9}|\+84[0-9]{9})" maxlength="13" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}"></div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   maxlength="150" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input id="password" type="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   maxlength="255" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>

                        <button class="btn btn-primary btn-block" type="submit">Register</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Already have an account? <a th:href="@{/login}">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
