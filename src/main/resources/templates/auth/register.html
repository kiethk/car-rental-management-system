<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account — DriveNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-surface d-flex flex-column" style="min-height: 100vh;">

<main class="d-flex flex-column justify-content-center align-items-center flex-grow-1" style="padding: 4.5rem 1.25rem 3.5rem;">
    <div class="w-100 mx-auto" style="max-width: 520px;">

        <!-- Brand Link Back to Home -->
        <div class="text-center mb-4">
            <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                <img th:src="@{/images/car-rental-logo.svg}" alt="DriveNow Logo" width="44" height="44" class="rounded-lg">
                <span class="font-weight-bold text-navy h4 mb-0 tracking-tight">DriveNow</span>
            </a>
        </div>

            <div class="card card-drivenow border shadow-sm p-4 p-md-5 bg-white rounded-2xl">
                <div class="card-body p-0">
                    <div class="text-center mb-4">
                        <h1 class="h3 font-weight-bold text-navy mb-1">Create Account</h1>
                        <p class="text-muted small mb-0">Join DriveNow to rent self-drive cars easily</p>
                    </div>

                    <div class="alert alert-danger py-2.5 small rounded-lg" th:if="${error}" th:text="${error}"></div>

                    <form method="post" th:action="@{/register}" th:object="${registerForm}" class="mt-3">
                        <div class="form-group mb-3">
                            <label for="name" class="small font-weight-bold text-navy mb-1">Full Name</label>
                            <input id="name" type="text" th:field="*{name}" class="form-control py-2.5 rounded-lg"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   maxlength="100" placeholder="e.g. John Doe" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="phone" class="small font-weight-bold text-navy mb-1">Phone Number</label>
                            <input id="phone" type="tel" th:field="*{phone}" class="form-control py-2.5 rounded-lg"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                   pattern="(0[0-9]{9}|\+84[0-9]{9})" maxlength="13" placeholder="0912345678" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email" class="small font-weight-bold text-navy mb-1">Email Address</label>
                            <input id="email" type="email" th:field="*{email}" class="form-control py-2.5 rounded-lg"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   maxlength="150" placeholder="name@example.com" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="password" class="small font-weight-bold text-navy mb-1">Password</label>
                            <input id="password" type="password" th:field="*{password}" class="form-control py-2.5 rounded-lg"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   maxlength="255" placeholder="••••••••" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <button class="btn btn-navy font-weight-bold btn-block w-100 py-2.5 rounded-lg shadow-sm" type="submit">Create Account</button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small text-muted">
                        Already have an account? <a th:href="@{/login}" class="font-weight-bold text-navy text-decoration-none">Sign in here</a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/}" class="text-muted small text-decoration-none hover:text-navy">← Return to Homepage</a>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
