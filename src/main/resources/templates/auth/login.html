<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DriveNow — Login</title><link rel="stylesheet" th:href="@{/css/bootstrap.css}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4 mb-4 text-center">Login</h1>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                    <form method="post" th:action="@{/login}" th:object="${loginForm}" novalidate>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" maxlength="150" autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input id="password" type="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" maxlength="255">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <button class="btn btn-primary btn-block" type="submit">Login</button>
                    </form>
                    <p class="text-center mt-3 mb-0">
                        Don't have an account? <a th:href="@{/register}">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body></html>
