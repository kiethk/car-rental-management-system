<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — DriveNow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-auto py-5 flex-grow-1 d-flex align-items-center">
    <div class="row justify-content-center w-100 mx-auto">
        <div class="col-md-7 col-lg-5 col-xl-4">
            <div class="card card-drivenow border shadow-sm p-3 p-md-4 bg-white rounded-xl">
                <div class="card-body p-2">
                    <div class="text-center mb-4">
                        <img th:src="@{/images/car-rental-logo.svg}" alt="Logo" class="w-12 h-12 mx-auto mb-2" width="48" height="48">
                        <h1 class="h4 font-weight-bold text-navy mb-1">Welcome Back</h1>
                        <p class="text-muted small mb-0">Sign in to your DriveNow account</p>
                    </div>

                    <div class="alert alert-danger py-2 small" th:if="${error}" th:text="${error}"></div>

                    <form method="post" th:action="@{/login}" th:object="${loginForm}" novalidate>
                        <div class="form-group mb-3">
                            <label for="email" class="small font-weight-bold text-navy mb-1">Email Address</label>
                            <input id="email" type="email" th:field="*{email}" class="form-control rounded-lg"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" maxlength="150" autofocus placeholder="name@example.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="form-group mb-4">
                            <label for="password" class="small font-weight-bold text-navy mb-1">Password</label>
                            <input id="password" type="password" th:field="*{password}" class="form-control rounded-lg"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" maxlength="255" placeholder="••••••••">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <button class="btn btn-navy font-weight-bold btn-block w-100 py-2 rounded-lg shadow-sm" type="submit">Sign In</button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small text-muted">
                        Don't have an account? <a th:href="@{/register}" class="font-weight-bold text-navy text-decoration-none">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
