<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Error — DriveNow</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/css/drivenow.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-surface">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5 text-center flex-grow-1">
    <div class="card card-drivenow border-0 p-5 d-inline-block" style="max-width: 500px;">
        <h1 class="display-3 font-weight-bold text-danger">500</h1>
        <h2 class="h5 font-weight-bold mb-3">Internal Server Error</h2>
        <p class="text-muted small mb-4" th:text="${errorMessage}">Something unexpected occurred while processing your request.</p>
        <a th:href="@{/}" class="btn btn-navy btn-sm px-4">Back to Home</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
