<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <body>
        <header th:fragment="header" class="bg-white text-navy sticky top-0 z-50 border-b border-border shadow-xs">
            <div class="max-w-7xl mx-auto px-5 sm:px-8">
                <div class="flex items-center justify-between h-18">
                    <!-- 1. Left: Logo -->
                    <a
                        th:href="@{/}"
                        class="flex items-center gap-2.5 hover:opacity-90 transition-opacity text-decoration-none"
                        style="text-decoration: none !important"
                    >
                        <img
                            th:src="@{/images/car-rental-logo.svg}"
                            alt="DriveNow Logo"
                            class="w-8 h-8 rounded-lg object-contain flex-shrink-0"
                            width="32"
                            height="32"
                        />
                        <span
                            class="font-bold text-lg leading-none tracking-tight text-navy"
                            style="color: #0f172a !important"
                            >DriveNow</span
                        >
                    </a>

                    <!-- 2. Center: Desktop Nav (with active tab indicator) -->
                    <nav class="hidden lg:flex items-center gap-1">
                        <a th:href="@{/}" class="header-nav-link" data-nav="home">Home</a>
                        <a th:href="@{/vehicles}" class="header-nav-link" data-nav="fleet">Browse Fleet</a>
                        <a th:href="@{/search}" class="header-nav-link" data-nav="search">Search Cars</a>
                        <a
                            th:if="${session.customerId != null}"
                            th:href="@{/bookings/my-bookings}"
                            class="header-nav-link"
                            data-nav="bookings"
                            >My Bookings</a
                        >
                    </nav>

                    <!-- 3. Right: Actions & User Dropdown -->
                    <div class="flex items-center gap-3">
                        <!-- CUSTOMER STATE -->
                        <th:block
                            th:if="${session.customerId != null}"
                            th:with="userLicense=${session.licenseStatus != null ? null : @licenseDocumentServiceImpl.getCustomerLicense(session.customerId)},
                                   effectiveLicenseStatus=${session.licenseStatus != null ? session.licenseStatus : (userLicense != null ? userLicense.status : 'not_uploaded')}"
                        >
                            <!-- Upload License CTA: ONLY shown if user has NOT uploaded license yet -->
                            <a
                                th:if="${effectiveLicenseStatus == null or effectiveLicenseStatus == 'not_uploaded'}"
                                th:href="@{/licenses/my-license}"
                                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-medium bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 transition-all text-decoration-none"
                                style="text-decoration: none !important"
                            >
                                <svg
                                    class="w-3.5 h-3.5 text-amber-600 flex-shrink-0"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <rect width="18" height="14" x="3" y="5" rx="2" />
                                    <circle cx="9" cy="11" r="2" />
                                    <path d="M15 11h2M15 14h2M6 16c0-1.5 1.5-2 3-2s3 .5 3 2" />
                                </svg>
                                <span>Upload License</span>
                            </a>

                            <!-- User Name & Dropdown Trigger (No avatar circle) -->
                            <div class="relative user-dropdown-container">
                                <button
                                    type="button"
                                    id="userDropdownBtn"
                                    class="header-user-btn"
                                    aria-expanded="false"
                                    aria-haspopup="true"
                                >
                                    <span th:text="${session.customerName != null ? session.customerName : 'Account'}"
                                        >User</span
                                    >
                                    <svg
                                        class="w-3.5 h-3.5 text-muted-foreground transition-transform duration-200 dropdown-chevron"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <path d="m6 9 6 6 6-6" />
                                    </svg>
                                </button>

                                <!-- Dropdown Menu -->
                                <div
                                    id="userDropdownMenu"
                                    class="hidden absolute right-0 top-full mt-2 header-dropdown-menu"
                                >
                                    <!-- Header Info -->
                                    <div class="px-4 py-2.5 border-b border-border">
                                        <p
                                            class="text-md-left font-bold text-navy truncate mb-1"
                                            style="color: #0f172a !important"
                                            th:text="${session.customerName != null ? session.customerName : 'Account'}"
                                        >
                                            User
                                        </p>
                                        <div class="flex items-center gap-1.5">
                                            <span class="text-sm inline-flex items-center">Customer</span>
                                        </div>
                                    </div>

                                    <!-- Menu Items -->
                                    <div class="py-1">
                                        <a th:href="@{/profile}" class="header-dropdown-item">
                                            <svg
                                                class="w-4 h-4 text-muted-foreground flex-shrink-0"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            >
                                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                                                <circle cx="12" cy="7" r="4" />
                                            </svg>
                                            <span>My Profile</span>
                                        </a>

                                        <!-- My License Item -->
                                        <a
                                            th:href="@{/licenses/my-license}"
                                            class="header-dropdown-item justify-between"
                                        >
                                            <div class="flex items-center gap-2.5">
                                                <svg
                                                    class="w-4 h-4 text-muted-foreground flex-shrink-0"
                                                    viewBox="0 0 24 24"
                                                    fill="none"
                                                    stroke="currentColor"
                                                    stroke-width="2"
                                                >
                                                    <rect width="18" height="14" x="3" y="5" rx="2" />
                                                    <circle cx="9" cy="11" r="2" />
                                                    <path d="M15 11h2M15 14h2M6 16c0-1.5 1.5-2 3-2s3 .5 3 2" />
                                                </svg>
                                                <span
                                                    th:text="${effectiveLicenseStatus != null and effectiveLicenseStatus != 'not_uploaded' ? 'My License' : 'Upload License'}"
                                                    >My License</span
                                                >
                                            </div>

                                            <!-- Status Badges -->
                                            <span
                                                th:if="${effectiveLicenseStatus == 'approved'}"
                                                class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"
                                            >
                                                Verified
                                            </span>
                                            <span
                                                th:if="${effectiveLicenseStatus == 'pending'}"
                                                class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-50 text-amber-800 border border-amber-200"
                                            >
                                                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Pending
                                            </span>
                                            <span
                                                th:if="${effectiveLicenseStatus == 'rejected'}"
                                                class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold bg-rose-50 text-rose-700 border border-rose-200"
                                            >
                                                Action Needed
                                            </span>
                                            <span
                                                th:if="${effectiveLicenseStatus == null or effectiveLicenseStatus == 'not_uploaded'}"
                                                class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-surface text-muted-foreground border border-border"
                                            >
                                                Required
                                            </span>
                                        </a>
                                    </div>

                                    <!-- Logout Divider & Item -->
                                    <div class="border-t border-border pt-1 mt-1">
                                        <a
                                            th:href="@{/logout}"
                                            class="header-dropdown-item text-danger"
                                            style="color: #dc2626 !important"
                                        >
                                            <svg
                                                class="w-4 h-4 text-danger flex-shrink-0"
                                                style="color: #dc2626 !important"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            >
                                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                                <polyline points="16 17 21 12 16 7" />
                                                <line x1="21" x2="9" y1="12" y2="12" />
                                            </svg>
                                            <span style="font-weight: 600">Log Out</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </th:block>

                        <!-- EMPLOYEE STATE -->
                        <th:block th:if="${session.employeeId != null and session.customerId == null}">
                            <div class="relative user-dropdown-container">
                                <button
                                    type="button"
                                    id="staffDropdownBtn"
                                    class="header-user-btn"
                                    aria-expanded="false"
                                    aria-haspopup="true"
                                >
                                    <span
                                        class="badge badge-warning text-dark text-[10px] px-1.5 py-0.5 rounded font-semibold uppercase"
                                        th:text="${session.employeeRole}"
                                        >Staff</span
                                    >
                                    <span th:text="${session.employeeName}">Staff</span>
                                    <svg
                                        class="w-3.5 h-3.5 text-muted-foreground transition-transform duration-200 dropdown-chevron"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                    >
                                        <path d="m6 9 6 6 6-6" />
                                    </svg>
                                </button>

                                <div
                                    id="staffDropdownMenu"
                                    class="hidden absolute right-0 top-full mt-2 header-dropdown-menu"
                                >
                                    <div class="px-4 py-2.5 border-b border-border">
                                        <p
                                            class="text-[11px] font-medium text-muted-foreground uppercase tracking-wider mb-0.5"
                                        >
                                            Staff Account
                                        </p>
                                        <p
                                            class="text-sm font-bold text-navy truncate mb-1"
                                            style="color: #0f172a !important"
                                            th:text="${session.employeeName}"
                                        >
                                            Staff Name
                                        </p>
                                        <span
                                            class="badge badge-warning text-dark text-[10px] font-semibold uppercase"
                                            th:text="${session.employeeRole}"
                                            >Role</span
                                        >
                                    </div>

                                    <div class="py-1">
                                        <a th:href="@{/admin/bookings}" class="header-dropdown-item">
                                            <svg
                                                class="w-4 h-4 text-muted-foreground"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            >
                                                <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                                                <line x1="16" x2="16" y1="2" y2="6" />
                                                <line x1="8" x2="8" y1="2" y2="6" />
                                                <line x1="3" x2="21" y1="10" y2="10" />
                                            </svg>
                                            <span>Manage Bookings</span>
                                        </a>
                                        <a th:href="@{/admin/licenses}" class="header-dropdown-item">
                                            <svg
                                                class="w-4 h-4 text-muted-foreground"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            >
                                                <rect width="18" height="14" x="3" y="5" rx="2" />
                                                <circle cx="9" cy="11" r="2" />
                                            </svg>
                                            <span>Verify Licenses</span>
                                        </a>
                                        <a th:href="@{/admin/vehicles}" class="header-dropdown-item">
                                            <svg
                                                class="w-4 h-4 text-muted-foreground"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            >
                                                <path
                                                    d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11.1 2 11.5 2 12v4c0 .6.4 1 1 1h2"
                                                />
                                            </svg>
                                            <span>Fleet Management</span>
                                        </a>
                                        <a th:href="@{/admin/password}" class="header-dropdown-item">
                                            <svg
                                                class="w-4 h-4 text-muted-foreground"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            >
                                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                            </svg>
                                            <span>Change Password</span>
                                        </a>
                                    </div>

                                    <div class="border-t border-border pt-1 mt-1">
                                        <a
                                            th:href="@{/logout}"
                                            class="header-dropdown-item text-danger"
                                            style="color: #dc2626 !important"
                                        >
                                            <svg
                                                class="w-4 h-4 text-danger flex-shrink-0"
                                                style="color: #dc2626 !important"
                                                viewBox="0 0 24 24"
                                                fill="none"
                                                stroke="currentColor"
                                                stroke-width="2"
                                            >
                                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                                <polyline points="16 17 21 12 16 7" />
                                                <line x1="21" x2="9" y1="12" y2="12" />
                                            </svg>
                                            <span style="font-weight: 600">Log Out</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </th:block>

                        <!-- GUEST STATE -->
                        <th:block th:if="${session.customerId == null and session.employeeId == null}">
                            <div class="flex items-center gap-2">
                                <a th:href="@{/register}" class="header-nav-link hidden sm:inline-flex"> Sign Up </a>
                                <a
                                    th:href="@{/login}"
                                    class="inline-flex items-center px-4 py-2 rounded-md text-xs font-semibold bg-navy hover:bg-navy-light text-white transition-all text-decoration-none"
                                    style="text-decoration: none !important; color: #ffffff !important"
                                >
                                    Sign In
                                </a>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>

            <!-- Active Tab & Dropdown Interaction Script -->
            <script>
                (function () {
                    function initHeader() {
                        // 1. Detect & Apply Active Tab
                        try {
                            var currentPath = window.location.pathname;
                            var navLinks = document.querySelectorAll(".header-nav-link");
                            navLinks.forEach(function (link) {
                                var href = link.getAttribute("href");
                                if (!href) return;

                                // Exact match for root "/" or prefix match for subpaths
                                if (href === "/" && (currentPath === "/" || currentPath === "")) {
                                    link.classList.add("active");
                                } else if (
                                    href !== "/" &&
                                    (currentPath === href ||
                                        currentPath.indexOf(href + "/") === 0 ||
                                        currentPath.indexOf(href + "?") === 0)
                                ) {
                                    link.classList.add("active");
                                } else {
                                    link.classList.remove("active");
                                }
                            });
                        } catch (e) {}

                        // 2. Dropdown Toggle Setup
                        var dropdownContainers = document.querySelectorAll(".user-dropdown-container");
                        dropdownContainers.forEach(function (container) {
                            var btn = container.querySelector('button[aria-haspopup="true"]');
                            var menu = container.querySelector('[id$="DropdownMenu"]');
                            var chevron = container.querySelector(".dropdown-chevron");
                            if (!btn || !menu) return;

                            function toggle(show) {
                                var isCurrentlyOpen = !menu.classList.contains("hidden");
                                var shouldOpen = show !== undefined ? show : !isCurrentlyOpen;

                                // Close all dropdowns
                                document.querySelectorAll('[id$="DropdownMenu"]').forEach(function (m) {
                                    m.classList.add("hidden");
                                });
                                document.querySelectorAll(".dropdown-chevron").forEach(function (c) {
                                    c.classList.remove("rotate-180");
                                });
                                document.querySelectorAll('button[aria-haspopup="true"]').forEach(function (b) {
                                    b.setAttribute("aria-expanded", "false");
                                });

                                if (shouldOpen) {
                                    menu.classList.remove("hidden");
                                    if (chevron) chevron.classList.add("rotate-180");
                                    btn.setAttribute("aria-expanded", "true");
                                }
                            }

                            btn.onclick = function (e) {
                                e.preventDefault();
                                e.stopPropagation();
                                var isOpen = !menu.classList.contains("hidden");
                                toggle(!isOpen);
                            };
                        });

                        // Global click outside to close dropdowns
                        document.addEventListener("click", function (e) {
                            if (!e.target.closest(".user-dropdown-container")) {
                                document.querySelectorAll('[id$="DropdownMenu"]').forEach(function (m) {
                                    m.classList.add("hidden");
                                });
                                document.querySelectorAll(".dropdown-chevron").forEach(function (c) {
                                    c.classList.remove("rotate-180");
                                });
                                document.querySelectorAll('button[aria-haspopup="true"]').forEach(function (b) {
                                    b.setAttribute("aria-expanded", "false");
                                });
                            }
                        });

                        // Escape key closes dropdown
                        document.addEventListener("keydown", function (e) {
                            if (e.key === "Escape") {
                                document.querySelectorAll('[id$="DropdownMenu"]').forEach(function (m) {
                                    m.classList.add("hidden");
                                });
                                document.querySelectorAll(".dropdown-chevron").forEach(function (c) {
                                    c.classList.remove("rotate-180");
                                });
                                document.querySelectorAll('button[aria-haspopup="true"]').forEach(function (b) {
                                    b.setAttribute("aria-expanded", "false");
                                });
                            }
                        });
                    }

                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", initHeader);
                    } else {
                        initHeader();
                    }
                })();
            </script>
        </header>
    </body>
</html>
