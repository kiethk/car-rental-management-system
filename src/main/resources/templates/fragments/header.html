<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="bg-white text-navy sticky top-0 z-50 border-b border-border shadow-xs">
    <div class="crms-container">
        <div class="flex items-center justify-between h-16">
            
            <!-- Logo -->
            <a th:href="@{/}" class="flex items-center gap-2.5 hover:opacity-90 transition-opacity text-decoration-none">
                <img th:src="@{/images/car-rental-logo.svg}" alt="DriveNow Logo" class="w-8 h-8 rounded-lg object-contain flex-shrink-0" width="32" height="32">
                <span class="font-bold text-lg leading-none tracking-tight text-navy">DriveNow</span>
            </a>

            <!-- Desktop Nav for Customers & Guests (hidden for employees) -->
            <nav th:if="${session.employeeId == null}" class="hidden lg:flex items-center gap-1">
                <a th:href="@{/}" class="crms-nav-link">Home</a>
                <a th:href="@{/vehicles}" class="crms-nav-link">Browse Cars</a>
                <a th:href="@{/search}" class="crms-nav-link">Rent a Car</a>
                <a th:if="${session.customerId != null}" th:href="@{/bookings/my-bookings}" class="crms-nav-link">My Bookings</a>
            </nav>



            <!-- Right side -->
            <div class="flex items-center gap-3">
                <!-- Customer Profile Dropdown -->
                <th:block th:if="${session.customerId != null}">
                    <div class="crms-dropdown">
                        <button type="button" class="crms-dropdown-toggle flex items-center gap-2 px-3 py-1.5 rounded-lg border border-border bg-white hover:bg-surface text-navy transition-all" onclick="toggleDropdown(this)">
                            <div class="w-7 h-7 rounded-full bg-navy text-white text-xs font-bold flex items-center justify-center flex-shrink-0">
                                <span th:text="${#strings.substring(session.customerName != null ? session.customerName : 'U', 0, 1)}">U</span>
                            </div>
                            <span class="text-xs font-semibold text-navy max-w-[120px] truncate hidden sm:inline" th:text="${session.customerName != null ? session.customerName : 'Customer'}">User</span>
                            <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        
                        <div class="crms-dropdown-menu">
                            <div class="px-4 py-2.5 border-b border-border bg-surface/50">
                                <div class="text-xs font-bold text-navy" th:text="${session.customerName}">Customer Name</div>
                                <div class="text-[11px] text-muted-foreground truncate" th:text="${session.customerEmail != null ? session.customerEmail : ''}">customer@gmail.com</div>
                            </div>
                            
                            <div class="py-1">
                                <a th:href="@{/profile}" class="crms-dropdown-item">
                                    <svg class="w-4 h-4 text-muted-foreground flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    <span>My Profile</span>
                                </a>
                                <a th:href="@{/bookings/my-bookings}" class="crms-dropdown-item">
                                    <svg class="w-4 h-4 text-muted-foreground flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                    <span>My Bookings</span>
                                </a>
                                <a th:href="@{/licenses/my-license}" class="crms-dropdown-item justify-between">
                                    <div class="flex items-center gap-2">
                                        <svg class="w-4 h-4 text-muted-foreground flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                        <span>Driver License</span>
                                    </div>
                                    <span th:if="${session.licenseStatus == 'approved'}" class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200">Verified</span>
                                    <span th:if="${session.licenseStatus == 'pending'}" class="text-[10px] px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 font-semibold border border-amber-200">Pending</span>
                                    <span th:if="${session.licenseStatus == null or session.licenseStatus == 'not_uploaded'}" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold border border-slate-200">Upload</span>
                                </a>
                            </div>
                            
                            <div class="border-t border-border py-1">
                                <a th:href="@{/logout}" class="crms-dropdown-item text-red-600 hover:bg-red-50 hover:text-red-700">
                                    <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                    <span>Sign Out</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </th:block>

                <!-- Employee Dropdown -->
                <th:block th:if="${session.employeeId != null and session.customerId == null}">
                    <div class="crms-dropdown">
                        <button type="button" class="crms-dropdown-toggle flex items-center gap-2 px-3 py-1.5 rounded-lg border border-border bg-white hover:bg-surface text-navy transition-all" onclick="toggleDropdown(this)">
                            <div class="w-7 h-7 rounded-full bg-slate-800 text-amber font-bold text-xs flex items-center justify-center flex-shrink-0">
                                <span>A</span>
                            </div>
                            <span class="text-xs font-semibold text-navy max-w-[120px] truncate hidden sm:inline" th:text="${session.employeeName != null ? session.employeeName : 'Operations'}">Staff</span>
                            <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        
                        <div class="crms-dropdown-menu">
                            <div class="px-4 py-2.5 border-b border-border bg-surface/50">
                                <div class="text-xs font-bold text-navy" th:text="${session.employeeName}">Staff Name</div>
                                <div class="text-[11px] text-muted-foreground uppercase font-semibold" style="letter-spacing: 0.05em;">Staff Operations</div>
                            </div>
                            
                            <div class="py-1">
                                <a th:href="@{/admin/dashboard}" class="crms-dropdown-item">
                                    <svg class="w-4 h-4 text-muted-foreground flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                    <span>Dashboard</span>
                                </a>
                                <a th:href="@{/admin/password}" class="crms-dropdown-item">
                                    <svg class="w-4 h-4 text-muted-foreground flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                                    <span>Change Password</span>
                                </a>
                            </div>
                            
                            <div class="border-t border-border py-1">
                                <a th:href="@{/logout}" class="crms-dropdown-item text-red-600 hover:bg-red-50 hover:text-red-700">
                                    <svg class="w-4 h-4 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                    <span>Sign Out</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </th:block>

                <!-- Guest Login Button -->
                <th:block th:if="${session.customerId == null and session.employeeId == null}">
                    <a th:href="@{/login}" class="car-action-btn-primary" style="height: 34px !important; font-size: 13px !important; padding: 0 16px !important;">Sign In</a>
                </th:block>
            </div>
        </div>
    </div>

    <!-- Dropdown & Active Navigation Script -->
    <script>
    function toggleDropdown(btn) {
        const parent = btn.closest('.crms-dropdown');
        const wasOpen = parent.classList.contains('open');
        document.querySelectorAll('.crms-dropdown').forEach(d => d.classList.remove('open'));
        if (!wasOpen) parent.classList.add('open');
    }
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.crms-dropdown')) {
            document.querySelectorAll('.crms-dropdown').forEach(d => d.classList.remove('open'));
        }
    });

    (function highlightActiveTab() {
        const path = window.location.pathname;
        const navLinks = document.querySelectorAll('nav .crms-nav-link');
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (!href) return;
            const cleanHref = href.split('?')[0].replace(/\/$/, '') || '/';
            const cleanPath = path.split('?')[0].replace(/\/$/, '') || '/';
            if (cleanHref === cleanPath) {
                link.classList.add('active');
            } else if (cleanHref !== '/' && cleanPath.startsWith(cleanHref)) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    })();
    </script>
</header>

</body>
</html>
