<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="form(action)">
    <div class="alert alert-success py-2 small" th:if="${param.updated}">Tài khoản của bạn đã được cập nhật thành công.</div>
    <div class="alert alert-danger py-2 small" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{${action}}" th:object="${profileForm}">
        <h2 class="h6 font-weight-bold text-navy mb-3">Thông tin tài khoản</h2>

        <div class="form-group mb-3">
            <label for="name" class="small font-weight-bold text-navy mb-1">Họ và tên</label>
            <input id="name" type="text" th:value="*{name}" class="form-control rounded-lg bg-light" readonly>
        </div>

        <div class="form-group mb-3">
            <label for="email" class="small font-weight-bold text-navy mb-1">Địa chỉ Email</label>
            <input id="email" type="email" th:value="*{email}" class="form-control rounded-lg bg-light" readonly>
        </div>

        <div class="form-group mb-4">
            <label for="phone" class="small font-weight-bold text-navy mb-1">Số điện thoại <span class="text-danger">*</span></label>
            <input id="phone" type="tel" th:field="*{phone}" class="form-control rounded-lg"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                   pattern="(0[0-9]{9}|\+84[0-9]{9})" maxlength="13" required>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <h2 class="h6 font-weight-bold text-navy mb-1 pt-3 border-top">Đổi mật khẩu</h2>
        <p class="text-muted small mb-3">Để trống các trường này nếu bạn muốn giữ nguyên mật khẩu hiện tại.</p>

        <div class="form-group mb-3">
            <label for="currentPassword" class="small font-weight-bold text-navy mb-1">Mật khẩu hiện tại</label>
            <input id="currentPassword" type="password" th:field="*{currentPassword}" class="form-control rounded-lg"
                   th:classappend="${#fields.hasErrors('currentPassword') or #fields.hasErrors('currentPasswordProvided')} ? 'is-invalid'"
                   maxlength="255" autocomplete="current-password">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPasswordProvided')}" th:errors="*{currentPasswordProvided}"></div>
        </div>

        <div class="form-group mb-3">
            <label for="newPassword" class="small font-weight-bold text-navy mb-1">Mật khẩu mới</label>
            <input id="newPassword" type="password" th:field="*{newPassword}" class="form-control rounded-lg"
                   th:classappend="${#fields.hasErrors('newPassword') or #fields.hasErrors('newPasswordLongEnough') or #fields.hasErrors('newPasswordDifferent')} ? 'is-invalid'"
                   maxlength="255" autocomplete="new-password">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPasswordLongEnough')}" th:errors="*{newPasswordLongEnough}"></div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPasswordDifferent')}" th:errors="*{newPasswordDifferent}"></div>
        </div>

        <div class="form-group mb-4">
            <label for="confirmPassword" class="small font-weight-bold text-navy mb-1">Xác nhận mật khẩu mới</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control rounded-lg"
                   th:classappend="${#fields.hasErrors('confirmPassword') or #fields.hasErrors('passwordConfirmed')} ? 'is-invalid'"
                   maxlength="255" autocomplete="new-password">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></div>
        </div>

        <button class="btn btn-navy font-weight-bold px-4 rounded-lg shadow-sm" type="submit">Lưu thay đổi</button>
    </form>
</div>

</body>
</html>
