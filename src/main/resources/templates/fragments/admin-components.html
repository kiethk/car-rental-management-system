<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- ==========================================================================
     CRMS React-Style Thymeleaf Component Library for Admin / Staff
     ========================================================================== -->

<!-- 1. Page Header Component (<PageHeader title="..." subtitle="..." />) -->
<div th:fragment="pageHeader(title, subtitle, backUrl, backText)" class="admin-page-header">
    <div class="admin-page-title-wrap">
        <div th:if="${backUrl != null}" class="admin-page-breadcrumb">
            <a th:href="${backUrl}">
                <svg class="w-3.5 h-3.5 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span th:text="${backText != null ? backText : 'Quay lại'}">Quay lại</span>
            </a>
        </div>
        <h1 class="admin-page-title" th:text="${title}">Tiêu đề trang</h1>
        <p th:if="${subtitle != null}" class="admin-page-subtitle" th:text="${subtitle}">Mô tả chi tiết nội dung trang</p>
    </div>
    <!-- Slot for actions (buttons) -->
    <div class="admin-page-actions" th:if="${actions != null}" th:insert="${actions}"></div>
</div>


<!-- 2. Stat Card Component (<StatCard label="..." value="..." subtext="..." />) -->
<div th:fragment="statCard(label, value, subtext, iconType, variant)" class="admin-stat-card">
    <div class="admin-stat-content">
        <span class="admin-stat-label" th:text="${label}">CHỈ SỐ</span>
        <span class="admin-stat-value" th:text="${value}">120</span>
        <span th:if="${subtext != null}" class="admin-stat-subtext" th:text="${subtext}">So với tháng trước</span>
    </div>
    <div th:class="'admin-stat-icon-wrap ' + (${variant != null ? variant : 'primary'})">
        <!-- Default Car Icon -->
        <svg th:if="${iconType == 'car' or iconType == null}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 17a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4zM5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11M3 13v4a1 1 0 001 1h1m14 0h1a1 1 0 001-1v-4M3 13h18"></path>
        </svg>
        <!-- Money / Dollar Icon -->
        <svg th:if="${iconType == 'money'}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <!-- Alert / Clock Icon -->
        <svg th:if="${iconType == 'clock'}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <!-- Check / Shield Icon -->
        <svg th:if="${iconType == 'check'}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
    </div>
</div>


<!-- 3. Status Badge Component (<StatusBadge status="..." label="..." variant="..." />) -->
<span th:fragment="statusBadge(status, label, variant)" 
      th:class="'admin-badge ' + (${variant != null ? 'admin-badge-' + variant : 'admin-badge-neutral'})">
    <span class="admin-badge-dot"></span>
    <span th:text="${label != null ? label : status}">Chờ xử lý</span>
</span>


<!-- 4. Flash Alert Component (<Alert type="success|error|warning" message="..." />) -->
<div th:fragment="alert(type, message)" 
     th:if="${message != null and !message.isBlank()}"
     th:class="'admin-alert ' + (${type == 'success' ? 'admin-alert-success' : (type == 'error' ? 'admin-alert-error' : 'admin-alert-info')})">
    <svg th:if="${type == 'success'}" class="admin-alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <svg th:if="${type == 'error'}" class="admin-alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <div class="admin-alert-content" th:text="${message}">Nội dung thông báo</div>
</div>


<!-- 5. Empty State Component (<EmptyState title="..." desc="..." actionUrl="..." actionText="..." />) -->
<div th:fragment="emptyState(title, desc, actionUrl, actionText)" class="admin-empty-state">
    <div class="admin-empty-icon">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
        </svg>
    </div>
    <div class="admin-empty-title" th:text="${title != null ? title : 'Không có dữ liệu'}">Không có dữ liệu</div>
    <div class="admin-empty-desc" th:text="${desc != null ? desc : 'Hiện tại chưa có bản ghi nào trong mục này.'}">Mô tả rỗng</div>
    <a th:if="${actionUrl != null and actionText != null}" th:href="${actionUrl}" class="admin-btn admin-btn-primary admin-btn-sm" th:text="${actionText}">
        Tạo mới
    </a>
</div>

</body>
</html>
