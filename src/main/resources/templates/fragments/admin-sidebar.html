<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    Admin Sidebar Fragment
    Pass active param: 'dashboard', 'bookings', 'contracts', 'vehicles', 'inspections', 'promotions', 'issues', 'licenses', 'accounts'
-->
<div th:fragment="sidebar(active)" class="list-group shadow-sm border-0 rounded-lg overflow-hidden mb-4">
    <div class="list-group-item bg-navy text-white py-3 border-0">
        <div class="d-flex align-items-center gap-2">
            <span class="font-weight-bold text-uppercase small" style="letter-spacing: 0.05em;">Operations Portal</span>
        </div>
    </div>

    <!-- Dashboard -->
    <a th:href="@{/admin/dashboard}"
       th:class="'list-group-item list-group-item-action py-3 border-bottom ' + (${active == 'dashboard'} ? 'bg-surface-2 font-weight-bold text-navy' : 'text-muted-foreground')">
        Dashboard
    </a>

    <!-- Rental Management -->
    <a th:href="@{/admin/bookings}"
       th:class="'list-group-item list-group-item-action py-3 border-bottom ' + (${active == 'bookings'} ? 'bg-surface-2 font-weight-bold text-navy' : 'text-muted-foreground')">
        Rental Management
    </a>
    <a th:href="@{/admin/contract-templates}"
       th:class="'list-group-item list-group-item-action py-3 border-bottom ' + (${active == 'contracts'} ? 'bg-surface-2 font-weight-bold text-navy' : 'text-muted-foreground')">
        Rental Terms
    </a>

    <!-- Car Management -->
    <a th:href="@{/admin/vehicles}"
       th:class="'list-group-item list-group-item-action py-3 border-bottom ' + (${active == 'vehicles'} ? 'bg-surface-2 font-weight-bold text-navy' : 'text-muted-foreground')">
        Car Management
    </a>
    <a th:href="@{/admin/inspections}"
       th:class="'list-group-item list-group-item-action py-3 border-bottom ' + (${active == 'inspections'} ? 'bg-surface-2 font-weight-bold text-navy' : 'text-muted-foreground')">
        Inspections & Maintenance
    </a>

    <!-- Promotions & Incidents (Coming soon) -->
    <div class="list-group-item py-3 border-bottom text-muted d-flex align-items-center justify-content-between" style="opacity: 0.65; cursor: not-allowed;" title="Chức năng đang phát triển theo Roadmap">
        <span>Promotions & Vouchers</span>
        <span class="badge badge-light border text-muted" style="font-size: 10px;">Coming soon</span>
    </div>
    <div class="list-group-item py-3 border-bottom text-muted d-flex align-items-center justify-content-between" style="opacity: 0.65; cursor: not-allowed;" title="Chức năng đang phát triển theo Roadmap">
        <span>Incidents & Fines</span>
        <span class="badge badge-light border text-muted" style="font-size: 10px;">Coming soon</span>
    </div>

    <!-- Driving License Review -->
    <a th:href="@{/admin/licenses}"
       th:class="'list-group-item list-group-item-action py-3 border-bottom ' + (${active == 'licenses'} ? 'bg-surface-2 font-weight-bold text-navy' : 'text-muted-foreground')">
        Driving License Review
    </a>
    <div class="list-group-item py-3 border-bottom text-muted d-flex align-items-center justify-content-between" style="opacity: 0.65; cursor: not-allowed;" title="Chức năng đang phát triển theo Roadmap">
        <span>Account Management</span>
        <span class="badge badge-light border text-muted" style="font-size: 10px;">Coming soon</span>
    </div>

    <div class="list-group-item bg-light p-3 text-center border-0">
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm btn-block">Customer View</a>
    </div>
</div>
</body>
</html>
