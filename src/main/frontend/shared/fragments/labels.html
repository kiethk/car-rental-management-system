<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Vietnamese display labels for the lowercase codes stored on vehicle types. Unknown codes show as-is. -->
<span th:fragment="transmission(value)"
      th:text="${value == 'automatic' ? 'Số tự động' : (value == 'manual' ? 'Số sàn' : value)}">Số tự động</span>
<span th:fragment="fuel(value)"
      th:text="${value == 'gasoline' ? 'Xăng' : (value == 'diesel' ? 'Dầu diesel' : (value == 'electric' ? 'Điện' : (value == 'hybrid' ? 'Hybrid' : value)))}">Xăng</span>
<!-- Roles and vehicle statuses are stored as lowercase codes; the screens show the Vietnamese name. -->
<span th:fragment="role(value)"
      th:text="${#strings.toLowerCase(value) == 'admin' ? 'Quản trị viên' : (#strings.toLowerCase(value) == 'staff' ? 'Nhân viên' : value)}">Nhân viên</span>
<span th:fragment="vehicleStatus(value)"
      th:text="${#strings.toLowerCase(value) == 'available' ? 'Sẵn sàng' : (#strings.toLowerCase(value) == 'rented' ? 'Đang thuê' : (#strings.toLowerCase(value) == 'maintenance' ? 'Bảo dưỡng' : (#strings.toLowerCase(value) == 'retired' ? 'Ngừng khai thác' : value)))}">Sẵn sàng</span>
<!-- Star rating from the reviews customers left; a vehicle type without reviews says so instead of showing a made-up score. -->
<span th:fragment="rating(summary)" th:with="reviewed=${summary != null and summary.count > 0}">
    <th:block th:if="${reviewed}">
        <span class="text-amber">★</span>
        <span class="text-amber" th:text="${#numbers.formatDecimal(summary.average, 1, 1)}">4.8</span>
        <span th:text="${'(' + summary.count + ' đánh giá)'}">(12 đánh giá)</span>
    </th:block>
    <span th:unless="${reviewed}">Chưa có đánh giá</span>
</span>
</body>
</html>
