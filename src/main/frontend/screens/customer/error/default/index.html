<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông báo — DriveNow</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <th:block th:replace="~{fragments/assets :: common}">
    </th:block>
    <link rel="stylesheet" th:href="@{/css/screens/customer/error/default/style.css}">
    <script defer th:src="@{/js/screens/customer/error/default/script.js}">
    </script>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-surface" data-screen="customer/error/default">
<th:block th:replace="~{layouts/customer :: shell(~{::screenContent})}">
    <th:block th:fragment="screenContent">
    
    <main class="container my-5 text-center flex-grow-1">
      <div class="card card-drivenow border-0 p-5 d-inline-block error-default-div-detail">
        <h1 class="display-3 fw-bold text-amber" th:text="${errorCode}">Thông báo</h1>
        <h2 class="h5 fw-bold mb-3">Không thể thực hiện thao tác</h2>
        <p class="text-muted small mb-4" th:text="${errorMessage}">Thao tác này không được phép ở trạng thái hiện tại.</p>
        <a th:href="@{/}" class="btn btn-navy btn-sm px-4">Về trang chủ</a>
      </div>
    </main>
    
  
    </th:block>
</th:block>
</body>
</html>
