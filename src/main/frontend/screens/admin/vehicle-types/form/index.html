<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/car-rental-logo.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${typeForm.id != null ? 'Sửa dòng xe' : 'Dòng xe mới'} + ' — Quản trị DriveNow'">Dòng xe</title>
    <th:block th:replace="~{fragments/assets :: common}"></th:block>
    <link rel="stylesheet" th:href="@{/css/screens/admin/vehicle-types/form/style.css}">
    <script defer th:src="@{/js/screens/admin/vehicle-types/form/script.js}"></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-surface" data-screen="admin/vehicle-types/form">

<th:block th:replace="~{layouts/admin :: shell(~{::screenContent}, 'vehicles')}">
    <th:block th:fragment="screenContent">
<!-- Flash Error -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 rounded-lg shadow-sm" role="alert">
                <span th:text="${error}"></span>
            </div>

            <div class="card border-0 shadow-sm rounded-xl p-4 p-md-5 bg-white max-w-4xl">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <h1 class="h4 fw-bold text-navy mb-1"
                            th:text="${typeForm.id != null ? 'Cập nhật dòng xe #' + typeForm.id : 'Thêm dòng xe mới'}">
                            Thêm dòng xe mới
                        </h1>
                        <p class="text-muted small mb-0">Cấu hình thông số kỹ thuật, giá thuê và hình ảnh cho dòng xe này.</p>
                    </div>
                    <a th:href="@{/admin/vehicle-types}" class="btn btn-outline-secondary btn-sm rounded-lg">
                        Quay lại danh mục dòng xe
                    </a>
                </div>

                <form method="post"
                      th:action="${typeForm.id != null ? '/admin/vehicle-types/' + typeForm.id : '/admin/vehicle-types'}"
                      th:object="${typeForm}"
                      enctype="multipart/form-data">

                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-3">
                        <!-- Model Name -->
                        <div class="col-md-6 form-group mb-3">
                            <label for="name" class="fw-bold small text-navy mb-1">Tên dòng xe <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control rounded-lg"
                                   placeholder="VD: Vios 2023, CR-V 2024, VF8..." required>
                            <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                        </div>

                        <!-- Brand -->
                        <div class="col-md-6 form-group mb-3">
                            <label for="brand" class="fw-bold small text-navy mb-1">Hãng xe <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{brand}" class="form-control rounded-lg"
                                   placeholder="VD: Toyota, Honda, VinFast, Hyundai..." required>
                            <small class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></small>
                        </div>

                        <!-- Category -->
                        <div class="col-md-4 form-group mb-3">
                            <label for="category" class="fw-bold small text-navy mb-1">Loại xe <span class="text-danger">*</span></label>
                            <select th:field="*{category}" class="form-control rounded-lg" required>
                                <option value="sedan">Sedan</option>
                                <option value="suv">SUV / Crossover</option>
                                <option value="hatchback">Hatchback</option>
                                <option value="minivan">Minivan / MPV</option>
                                <option value="pickup">Bán tải</option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>
                        </div>

                        <!-- Seats -->
                        <div class="col-md-4 form-group mb-3">
                            <label for="seats" class="fw-bold small text-navy mb-1">Số chỗ <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{seats}" class="form-control rounded-lg" min="1" max="50" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('seats')}" th:errors="*{seats}"></small>
                        </div>

                        <!-- Price Per Hour -->
                        <div class="col-md-4 form-group mb-3">
                            <label for="pricePerHour" class="fw-bold small text-navy mb-1">Đơn giá thuê theo giờ (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" step="1000" th:field="*{pricePerHour}" class="form-control rounded-lg" min="0" placeholder="e.g. 150000" required>
                            <small class="text-danger" th:if="${#fields.hasErrors('pricePerHour')}" th:errors="*{pricePerHour}"></small>
                        </div>

                        <!-- Transmission -->
                        <div class="col-md-6 form-group mb-3">
                            <label for="transmission" class="fw-bold small text-navy mb-1">Hộp số <span class="text-danger">*</span></label>
                            <select th:field="*{transmission}" class="form-control rounded-lg" required>
                                <option value="automatic">Số tự động</option>
                                <option value="manual">Số sàn</option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('transmission')}" th:errors="*{transmission}"></small>
                        </div>

                        <!-- Fuel Type -->
                        <div class="col-md-6 form-group mb-3">
                            <label for="fuelType" class="fw-bold small text-navy mb-1">Nhiên liệu <span class="text-danger">*</span></label>
                            <select th:field="*{fuelType}" class="form-control rounded-lg" required>
                                <option value="gasoline">Xăng</option>
                                <option value="diesel">Dầu diesel</option>
                                <option value="electric">Điện (EV)</option>
                                <option value="hybrid">Hybrid</option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('fuelType')}" th:errors="*{fuelType}"></small>
                        </div>

                        <!-- Photo: Upload file or Online URL -->
                        <div class="col-12 form-group mb-3 p-3 bg-surface rounded-xl border">
                            <div class="fw-bold small text-navy mb-2">
                                Hình ảnh dòng xe:
                            </label>

                            <div class="row align-items-center">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="imageFileInput" class="small fw-bold text-navy mb-1 d-block">Cách 1: Tải ảnh từ máy</label>
                                    <div class="d-flex align-items-center gap-2">
                                        <label for="imageFileInput" class="btn btn-outline-navy btn-sm mb-0 px-3 py-1 fw-bold vehicle-types-form-label-detail">
                                            Chọn tệp
                                        </label>
                                        <input type="file" id="imageFileInput" name="imageFile" accept="image/png, image/jpeg, image/webp" class="visually-hidden" data-vehicle-type-image>
                                        <span id="chosenFileName" class="small text-muted text-truncate vehicle-types-form-chosen-file-name">Chưa chọn tệp</span>
                                        <button type="button" id="clearFileBtn" class="btn btn-sm btn-link text-danger p-0 vehicle-types-form-clear-file-btn" data-clear-vehicle-type-image title="Bỏ tệp đã chọn" hidden>✕</button>
                                    </div>
                                    <small class="form-text text-muted mt-1">Formats: JPG, PNG, WebP (Saved to uploads/)</small>
                                </div>
                                <div class="col-md-6">
                                    <label for="imageUrlInput" class="small fw-bold text-navy mb-1 d-block">Cách 2: Dán đường dẫn ảnh</label>
                                    <input type="url" id="imageUrlInput" th:field="*{imageUrl}" class="form-control form-control-sm rounded-lg"
                                           placeholder="https://images.unsplash.com/...">
                                    <small id="imageUrlHelp" class="form-text text-muted">Dán đường dẫn ảnh trên mạng nếu không tải tệp.</small>
                                </div>
                            </div>

                            <!-- Image Preview if available -->
                            <div th:if="${typeForm.imageUrl != null and !typeForm.imageUrl.isBlank()}" class="mt-3 pt-2 border-top">
                                <span class="small text-muted me-2">Ảnh hiện tại:</span>
                                <img th:src="${typeForm.imageUrl}" class="rounded border mt-1 vehicle-types-form-img-detail"
                                     data-image-fallback="/images/car-rental-logo.svg">
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="col-12 form-group mb-4">
                            <label for="description" class="fw-bold small text-navy mb-1">Mô tả & chi tiết</label>
                            <textarea th:field="*{description}" rows="3" class="form-control rounded-lg"
                                      placeholder="Đặc điểm nổi bật, thông số và tiện nghi..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/admin/vehicle-types}" class="btn btn-light px-4 rounded-lg">Hủy</a>
                        <button type="submit" class="btn btn-navy fw-bold px-4 rounded-lg shadow-sm">
                            Lưu dòng xe
                        </button>
                    </div>
                </form>
            </div>
    </th:block>
</th:block>



</body>
</html>
